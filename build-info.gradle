buildscript {
    repositories {
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "org.ajoberstar.grgit:grgit-gradle:4.1.1"
    }
}

apply plugin: org.ajoberstar.grgit.gradle.GrgitPlugin

import org.ajoberstar.grgit.Grgit

def repoPattern = /(?<=\/|:){1}[^\/]+\/[^\/\.]+(?=(?:\.git)|$)/

task gitInfo() {
    def projectDir = project.projectDir
    def projectProps = project.properties
    def hasProperty = project.hasProperty("buildNumber")
    def buildNumberProp = hasProperty ? project.buildNumber : null

    doLast {
        try {
            def grgit = Grgit.open(dir: projectDir.toString())
            def branch = grgit.branch.getCurrent().getName() + '-' + grgit.head().id
            def repo = grgit.remote.list().collect { remote -> (remote.url =~ repoPattern)[0] }.unique(false).getAt(0)

            projectProps.ext.set("branch", branch)
            projectProps.ext.set("repo", repo)

            def buildNumber = !releaseMode && hasProperty && buildNumberProp?.trim() ? "-$buildNumberProp" : ''
            projectProps.ext.set('buildNumber', buildNumber)
        } catch (ignored) {
            projectProps.ext.set("branch", '')
            projectProps.ext.set("repo", '')
            projectProps.ext.set("buildNumber", '')
        }
    }
}

task addDockerfileToGit {
    doLast {
        grgit.add {
            patterns = ['Dockerfile']
        }
    }
}

task removeDockerfileFromGit {
    doLast {
        grgit.remove {
            patterns = ['Dockerfile']
        }
    }
}

def getCurrentGitBranch() {
    try {
        def grgit = Grgit.open(dir: project.projectDir.toString())
        return grgit.branch.getCurrent().getName() + '-' + grgit.head().id
    }
    catch (Exception) {
        return ""
    }
}

ext {
    getCurrentGitBranch = this.&getCurrentGitBranch
}
